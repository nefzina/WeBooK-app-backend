name: Build and deploy

on:
  pull_request:
    branches:
      - QA
jobs:
  build-deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
      SPRING_DATASOURCE_USERNAME: 'my'
      SPRING_DATASOURCE_PASSWORD: 'password'
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      MJ_APIKEY_PRIVATE: ${{ secrets.MJ_APIKEY_PRIVATE }}
      MJ_APIKEY_PUBLIC: ${{ secrets.MJ_APIKEY_PUBLIC }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}

    steps:   
     - uses: actions/checkout@v4
     - uses: actions/setup-java@v4
       with:
          distribution: 'corretto'
          java-version: '21'

     - name: Unit tests
       run: mvn -B test --file pom.xml

     - name: Build the application
       run: mvn -B package --file pom.xml

     - name: Set up QEMU
       uses: docker/setup-qemu-action@v3
     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3
     - name: Login to Docker Hub
       uses: docker/login-action@v3
       with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
     - name: Build and push
       uses: docker/build-push-action@v5
       with:
         context: .
         push: true
         tags: ${{ secrets.DOCKERHUB_USERNAME }}/webook_app:latest  # webook_app is the name of docker repo

     - name: deploy on vps
       uses: appleboy/ssh-action@v1.0.3
       with:
         host: ${{ secrets.VPS_HOST_ADDRESS }}
         username: ${{ secrets.VPS_USERNAME }}
         password: ${{ secrets.VPS_PASSWORD }}
         port: ${{ secrets.VPS_PORT }}
         script: |
           cd WeBooK-app-backend
           git checkout QA
           git pull origin QA
           export DB_USERNAME=${{ secrets.DB_USERNAME }}
           export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
           export DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
           sudo docker compose up -d
